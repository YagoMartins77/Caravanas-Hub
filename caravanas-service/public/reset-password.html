<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova senha — Caravana's Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <a class="brand" href="/"><div class="logo"><i class="fas fa-bus"></i></div><span>Caravana's <b>Hub</b></span></a>
    <h2>Nova senha</h2>
    <form id="resetForm">
      <div class="field">
        <label for="novaSenha">Nova senha</label>
        <input type="password" id="novaSenha" placeholder="Mínimo 6 caracteres" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Salvar nova senha</button>
    </form>
    <div id="msg" class="msg"></div>
    <p><a href="auth.html">Voltar para o login</a></p>
  </div>

  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, novaSenha: document.getElementById('novaSenha').value })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erro ao redefinir.');
        msg.className = 'msg ok';
        msg.textContent = 'Senha alterada! Redirecionando...';
        setTimeout(() => (window.location.href = 'auth.html'), 2000);
      } catch (err) {
        msg.className = 'msg err';
        msg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
