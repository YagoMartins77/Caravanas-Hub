<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Caravana's Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <a class="brand" href="/"><div class="logo"><i class="fas fa-bus"></i></div><span>Caravana's <b>Hub</b></span></a>
    <h2 id="formTitle">Entrar</h2>

    <form id="authForm">
      <div class="field" id="campoNome" style="display:none;">
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Seu nome">
      </div>
      <div class="field" id="campoTime" style="display:none;">
        <label for="time_torcida">Time / atleta que você torce (opcional)</label>
        <input type="text" id="time_torcida" placeholder="Ex.: Palmeiras, Ferrari, Charles do Bronx">
      </div>
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="voce@email.com" required>
      </div>
      <div class="field" id="campoSenha">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Mínimo 6 caracteres" required minlength="6">
      </div>
      <button type="submit" id="submitBtn" class="btn btn-primary" style="width:100%;">Entrar</button>
    </form>

    <p id="toggleText"></p>
    <p id="forgotText"><a data-modo="esqueci">Esqueci minha senha</a></p>
    <div id="msg" class="msg"></div>
  </div>

  <script>
    let modo = 'login';
    const $ = (id) => document.getElementById(id);

    function setModo(m) {
      modo = m;
      $('msg').textContent = '';
      $('campoNome').style.display = m === 'cadastro' ? 'block' : 'none';
      $('campoTime').style.display = m === 'cadastro' ? 'block' : 'none';
      $('nome').required = m === 'cadastro';
      $('campoSenha').style.display = m === 'esqueci' ? 'none' : 'block';
      $('senha').required = m !== 'esqueci';
      $('forgotText').style.display = m === 'login' ? 'block' : 'none';
      const textos = {
        login:    ['Entrar', 'Entrar', 'Não tem conta? <a data-modo="cadastro">Cadastre-se grátis</a>'],
        cadastro: ['Criar conta', 'Criar conta', 'Já tem conta? <a data-modo="login">Entrar</a>'],
        esqueci:  ['Recuperar senha', 'Enviar link por e-mail', 'Lembrou? <a data-modo="login">Voltar ao login</a>']
      }[m];
      $('formTitle').textContent = textos[0];
      $('submitBtn').textContent = textos[1];
      $('toggleText').innerHTML = textos[2];
    }

    document.addEventListener('click', (e) => {
      const m = e.target.closest('[data-modo]');
      if (m) setModo(m.dataset.modo);
    });

    $('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = $('email').value.trim();
      const senha = $('senha').value;
      const nome = $('nome').value.trim();
      const time_torcida = $('time_torcida').value.trim();
      const rotas = {
        login:    ['/api/auth/login', { email, senha }],
        cadastro: ['/api/auth/register', { nome, email, senha, time_torcida }],
        esqueci:  ['/api/auth/forgot-password', { email }]
      };
      const [url, body] = rotas[modo];
      const msg = $('msg');
      $('submitBtn').disabled = true;
      try {
        const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Erro na requisição.');
        if (modo === 'login') return (window.location.href = 'app.html');
        if (modo === 'cadastro') {
          // Já entra direto depois de cadastrar
          const login = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, senha }) });
          if (login.ok) return (window.location.href = 'app.html');
          msg.className = 'msg ok'; msg.textContent = 'Conta criada! Faça login.'; setModo('login');
          return;
        }
        msg.className = 'msg ok';
        msg.textContent = data.message || 'Se o e-mail existir, enviamos o link.';
      } catch (err) {
        msg.className = 'msg err';
        msg.textContent = err.message;
      } finally {
        $('submitBtn').disabled = false;
      }
    });

    setModo(new URLSearchParams(location.search).get('modo') === 'cadastro' ? 'cadastro' : 'login');
  </script>
</body>
</html>
